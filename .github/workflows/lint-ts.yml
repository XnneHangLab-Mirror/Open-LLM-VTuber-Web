name: Lint TypeScript

on:
  push:
    branches: [xnne-dev]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".eslintrc.*"
      - ".github/workflows/lint-ts.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".eslintrc.*"
      - ".github/workflows/lint-ts.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: ESLint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint . --ext .js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts
